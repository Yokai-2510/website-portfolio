<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eshaan Sharma — Algorithmic trading & low-latency systems</title>
<meta name="description" content="Freelance algorithmic-trading developer in Gurgaon, India. Event-driven order pipelines, market-data infrastructure and deterministic execution.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('es-theme')||'night'}catch(e){document.documentElement.dataset.theme='night'}</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Work.jsx"></script>
<script type="text/babel" src="Products.jsx"></script>
<script type="text/babel" src="Writing.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel">
const { Field, TopBar, Footer, requestTheme } = window.EshaanSharmaDesignSystem_4751b7;
const SCREENS = { Home: HomeScreen, Work: WorkScreen, Case: CaseScreen, Products: ProductsScreen, Writing: WritingScreen, Article: ArticleScreen, Craft: CraftScreen, About: AboutScreen, Contact: ContactScreen };
const SECTION = { Case: 'Work', Article: 'Writing' };
function App() {
  const t = { inkStyle: 'smoke' };
  const [route, setRoute] = React.useState(() => { try { const r = JSON.parse(localStorage.getItem('es-kit-route')) || { page: 'Home' }; return SCREENS[r.page] ? r : { page: r.page === 'Lab' ? 'Craft' : 'Home' }; } catch (e) { return { page: 'Home' }; } });
  const [leaving, setLeaving] = React.useState(false);
  const go = React.useCallback((page, param) => {
    setLeaving(true);
    window.dispatchEvent(new CustomEvent('field:navigate'));
    setTimeout(() => { const r = { page, param }; setRoute(r); localStorage.setItem('es-kit-route', JSON.stringify(r)); window.scrollTo(0, 0); setLeaving(false); }, 180);
  }, []);
  React.useEffect(() => {
    const k = (e) => {
      if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 't' || e.key === 'T') { const sw = document.querySelector('.topbar .theme-switch'); sw ? sw.click() : requestTheme(document.documentElement.dataset.theme === 'ink' ? 'night' : 'ink'); }
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, []);
  const Screen = SCREENS[route.page] || HomeScreen;
  return (
    <>
      <Field inkStyle={t.inkStyle} />
      <TopBar active={SECTION[route.page] || route.page} onNavigate={go} />
      <main className={'kit-main' + (leaving ? ' is-leaving' : '')} key={route.page + (route.param || '')}>
        <Screen go={go} param={route.param} />
      </main>
      <Footer onNavigate={go} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
