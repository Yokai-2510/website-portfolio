<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Eshaan Sharma: algorithmic trading and low-latency systems developer.">
<title>Eshaan Sharma</title>
<script>try{var s=localStorage.getItem('es-theme');document.documentElement.dataset.theme=s==='ink'?'ink':'aether'}catch(e){document.documentElement.dataset.theme='aether'}</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="image-slot.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/work.jsx"></script>
<script type="text/babel" src="screens/about.jsx"></script>
<script type="text/babel" src="screens/personal.jsx"></script>
<script type="text/babel" src="screens/contact.jsx"></script>
<script type="text/babel">
const { Field, TopBar, Footer } = window.EshaanSharmaDesignSystem_4751b7;
const SCREENS = { Home: HomeScreen, Work: WorkScreen, Case: CaseScreen, About: AboutScreen, Personal: PersonalScreen, Interest: InterestScreen, Article: ArticleScreen, Connect: ContactScreen };
const SECTION = { Case: 'Work', Interest: 'Personal', Article: 'Personal' };
const SUB = { Case: 1, Interest: 1, Article: 1 };
// Older routes and in-page destinations resolve to one of the four pages (+ the section to land on).
const ALIAS = { Contact: ['Connect'], Products: ['Work', 'products'], Craft: ['About', 'skills'], Writing: ['Interest', 'quant-dev'], Lab: ['Interest', 'design'] };
const resolve = (page, param) => (ALIAS[page] ? { page: ALIAS[page][0], param: ALIAS[page][1] } : SCREENS[page] ? { page, param } : { page: 'Home' });
// Deep links: #Work, #About, #Case/rank-displacement, #Interest/game-dev
const fromHash = () => { const h = decodeURIComponent(location.hash.slice(1)); if (!h) return null; const [page, param] = h.split('/'); return resolve(page, param); };
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "inkStyle": "release"
}/*EDITMODE-END*/;

window.esJump = (id, smooth) => {
  const el = document.getElementById(id); if (!el) return;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 96, behavior: smooth ? 'smooth' : 'auto' });
};
const isInk = () => document.documentElement.dataset.theme === 'ink';
// Change state the way a click on the switch does, so the transformation starts from it.
const toInk = () => {
  const sw = document.querySelector('.topbar .theme-switch');
  if (sw) { sw.click(); return; }
  if (window.__esField > 0) window.dispatchEvent(new CustomEvent('field:theme', { detail: { theme: 'ink', sx: innerWidth / 2, sy: innerHeight / 2 } }));
  else { document.documentElement.dataset.theme = 'ink'; try { localStorage.setItem('es-theme', 'ink'); } catch (e) {} }
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // Hidden: Alt/Option + Shift + K switches Ink to the iteration that is not the default, and back. Stored per visitor.
  const [inkAlt, setInkAlt] = React.useState(() => { try { return localStorage.getItem('es-ink'); } catch (e) { return null; } });
  const ink = inkAlt || t.inkStyle;
  const [route, setRoute] = React.useState(() => { const hr = fromHash(); if (hr) return hr; try { const r = JSON.parse(localStorage.getItem('es-kit-route')) || {}; return resolve(r.page, r.param); } catch (e) { return { page: 'Home' }; } });
  const cur = React.useRef(route); cur.current = route;
  const [leaving, setLeaving] = React.useState(false);
  const go = React.useCallback((page, param) => {
    const r = resolve(page, param);
    if (r.page === cur.current.page && !SUB[r.page]) { if (r.param) window.esJump(r.param, true); else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    setLeaving(true);
    window.dispatchEvent(new CustomEvent('field:navigate'));
    setTimeout(() => { setRoute(r); try { localStorage.setItem('es-kit-route', JSON.stringify(SUB[r.page] ? r : { page: r.page })); history.replaceState(null, '', '#' + r.page + (SUB[r.page] ? '/' + r.param : '')); } catch (e) {} window.scrollTo(0, 0); setLeaving(false); }, 180);
  }, []);
  React.useEffect(() => {
    const k = (e) => {
      if (e.code !== 'KeyK' || !e.altKey || !e.shiftKey || e.metaKey || e.ctrlKey) return;
      if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
      e.preventDefault();
      const alt = t.inkStyle === 'release' ? 'smoke' : 'release';
      const next = !isInk() ? alt : ink === 'release' ? 'smoke' : 'release';
      setInkAlt(next); try { localStorage.setItem('es-ink', next); } catch (_) {}
      if (!isInk()) setTimeout(toInk, 30);
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [ink, t.inkStyle]);
  const Screen = SCREENS[route.page] || HomeScreen;
  const sub = SUB[route.page] ? ':' + route.param : '';
  return (
    <>
      <Field inkStyle={ink} />
      <TopBar items={['Work', 'About', 'Personal']} cta="Connect" active={SECTION[route.page] || route.page} route={route.page + sub} onNavigate={go} />
      <main className={'kit-main' + (leaving ? ' is-leaving' : '')} key={route.page + sub}>
        <Screen go={go} param={route.param} />
      </main>
      <Footer onNavigate={go} index={['Home', 'Work', 'About', 'Personal', 'Connect']} />
      <TweaksPanel>
        <TweakSection label="Ink behaviour (light theme)" />
        <TweakRadio label="Ink" value={ink} options={['smoke', 'release']} onChange={(v) => { setTweak('inkStyle', v); setInkAlt(null); try { localStorage.removeItem('es-ink'); } catch (_) {} if (!isInk()) toInk(); }} />
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
